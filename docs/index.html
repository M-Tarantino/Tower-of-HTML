<!DOCTYPE html>
<html>
<head>
<title>Tower of HTML</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    background-color: #000000;
    color: #00ff00;
    font-family: monospace;
    padding: 10px;
    margin: 0;
}
.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}
.header {
    border-bottom: 1px solid currentColor;
    padding-bottom: 8px;
    margin-bottom: 12px;
}
.header-table {
    width: 100%;
    border-collapse: collapse;
}
.header-left {
    text-align: left;
    vertical-align: middle;
}
.header-right {
    text-align: right;
    vertical-align: middle;
}
h1 {
    font-size: 16px;
    margin: 0;
    display: inline;
}
.top-btn {
    width: auto !important;
    padding: 2px 6px !important;
    margin-left: 6px !important;
    display: inline-block !important;
    font-size: 10px !important;
    vertical-align: middle;
}
.github-btn {
    width: auto !important;
    padding: 2px 6px !important;
    display: inline-block !important;
    font-size: 10px !important;
    text-decoration: none;
    font-weight: bold;
}
.lang-tag {
    font-size: 11px;
    font-weight: bold;
    margin-right: 6px;
}
.theme-panel {
    display: none;
    border: 1px solid currentColor;
    padding: 8px;
    margin-bottom: 12px;
    font-size: 11px;
}
.preset-group {
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px dashed currentColor;
}
.theme-panel label {
    margin-right: 10px;
}
.theme-panel input[type="text"] {
    width: 65px;
    background-color: transparent;
    color: inherit;
    border: 1px solid currentColor;
    font-family: monospace;
    font-size: 11px;
    padding: 2px 4px;
}
.tower {
    border: 1px solid currentColor;
    padding: 8px;
    margin-bottom: 10px;
    min-height: 85px;
}
.step {
    border-bottom: 1px dashed currentColor;
    padding: 3px;
    font-size: 12px;
}
.step:last-child {
    border-bottom: none;
}
.player {
    font-weight: bold;
    color: #000000;
    background-color: #00ff00;
}
.info-box {
    border: 1px solid currentColor;
    padding: 10px;
    font-size: 12px;
    margin-bottom: 10px;
    line-height: 1.4;
}
textarea, input[type="text"] {
    width: 100%;
    background-color: transparent;
    color: inherit;
    border: 1px solid currentColor;
    font-family: monospace;
    box-sizing: border-box;
    padding: 6px;
    margin-bottom: 6px;
}
button {
    background-color: #00ff00;
    color: #000000;
    border: 1px solid #00ff00;
    font-family: monospace;
    font-weight: bold;
    width: 100%;
    padding: 10px;
    cursor: pointer;
}
.preset-btn {
    width: auto !important;
    padding: 3px 6px !important;
    margin-right: 3px !important;
    margin-bottom: 3px !important;
    display: inline-block !important;
    font-size: 10px !important;
}
.msg {
    margin-top: 8px;
    font-size: 12px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <!-- HEADER BAR -->
    <div class="header">
        <table class="header-table">
            <tr>
                <td class="header-left">
                    <h1>TOWER OF HTML</h1>
                    <button class="top-btn" onclick="toggleThemeMenu()">[COLORS]</button>
                </td>
                <td class="header-right">
                    <span class="lang-tag">DE / EN</span>
                    <a href="https://github.com" target="_blank" class="github-btn" id="gh-link">GITHUB</a>
                </td>
            </tr>
        </table>
    </div>
    
    <!-- COLLAPSIBLE COLOR MENU -->
    <div class="theme-panel" id="theme-menu">
        <div class="preset-group">
            <span style="font-weight:bold; display:block; margin-bottom:4px;">PRESETS:</span>
            <button class="preset-btn" onclick="setPreset('#000000', '#00ff00')">Matrix</button>
            <button class="preset-btn" onclick="setPreset('#000000', '#ffb000')">Amber</button>
            <button class="preset-btn" onclick="setPreset('#0000aa', '#ffffff')">DOS Blue</button>
            <button class="preset-btn" onclick="setPreset('#ffffff', '#111111')">Light</button>
            <button class="preset-btn" onclick="setPreset('#1a0022', '#00ffff')">Cyber</button>
        </div>
        <div>
            <span style="font-weight:bold;">CUSTOM:</span>
            <label>BG: <input type="text" id="bg-color-in" value="#000000" onchange="applyColors()"></label>
            <label>TEXT: <input type="text" id="text-color-in" value="#00ff00" onchange="applyColors()"></label>
            <button class="preset-btn" onclick="applyColors()">SET</button>
        </div>
    </div>

    <div id="status" style="font-size:14px; font-weight:bold; margin-bottom:5px;"></div>
    
    <!-- TOWER VIEW (SHOWING PREVIOUS, CURRENT, AND NEXT FLOOR) -->
    <div class="tower" id="tower-view">
        <!-- Rendered via JS -->
    </div>

    <!-- EXPLANATION BOX -->
    <div class="info-box" id="info-text">
        <!-- Text rendered via JS -->
    </div>

    <div id="task-box">
        <p id="task-text" style="font-size:12px; font-weight:bold; margin: 0 0 5px 0;"></p>
        <textarea id="user-code" rows="3" placeholder="Code hier eingeben..."></textarea>
        <button onclick="checkCode()">CHECK CODE</button>
    </div>

    <div style="margin-top: 15px; border-top: 1px solid currentColor; padding-top: 8px;">
        <p style="font-size:10px; margin:0 0 3px 0;">ETAGEN-CODE EINGEBEN ZUM SPRINGEN:</p>
        <input type="text" id="level-pass" placeholder="z. B. START oder L1-ROOT">
        <button onclick="jumpLevel()">SPRINGE ZUR ETAGIE</button>
    </div>

    <div class="msg" id="msg-box"></div>
</div>

<script>
// --- LEVEL DATA (FLOOR 0 INTRO + FLOORS 1 - 5) ---
var levels = [
    {
        id: "START",
        title: "Floor 0: Anleitung & Überblick",
        info: "Willkommen beim <b>Tower of HTML</b>!<br><br><b>Was ist das?</b><br>Ein interaktiver Turm zum Erlernen der Grundbausteine von HTML.<br><br><b>Wie funktioniert es?</b><br>1. Lies die Erklärungen auf jeder Etage.<br>2. Gib den geforderten HTML-Code in das Textfeld ein.<br>3. Klicke auf <b>CHECK CODE</b>, um die Etage zu bestehen.<br>4. Du erhältst nach jedem Erfolg den Code für die nächste Etage.",
        hint: "Gib das Wort <b>START</b> ein, um den Turm zu betreten.",
        desc: "Tippe exakt: START",
        check: function(input) {
            return input.toLowerCase().indexOf("start") !== -1;
        }
    },
    {
        id: "L1-ROOT",
        title: "Floor 1: Das Root-Element",
        info: "Code besteht aus Befehlen, die der Browser liest.<br><br>HTML baut Webseiten mithilfe von <b>Tags</b> auf. Ein Tag ist ein Wort zwischen zwei Klammersymbolen:<br>• <b>&lt;</b> (Kleiner-als-Zeichen)<br>• <b>&gt;</b> (Größer-als-Zeichen)<br><br>Der allererste Tag jeder Webseite lautet <b>html</b>. Mit den Klammern geschrieben sieht er so aus: <code>&lt;html&gt;</code>.",
        hint: "Verwende die Zeichen '<' und '>' auf deiner Tastatur.",
        desc: "Tippe exakt: <html>",
        check: function(input) {
            return input.toLowerCase().indexOf("<html>") !== -1;
        }
    },
    {
        id: "L2-HEAD",
        title: "Floor 2: Der Head-Bereich",
        info: "Webseiten unterteilen sich in zwei Hauptbereiche: den unsichtbaren Konfigurationsbereich und den sichtbaren Inhalt.<br><br>Der unsichtbare Bereich heißt <b>head</b>. Er enthält Einstellungen und technische Daten für den Browser.<br><br>Genauso wie in Floor 1 schreibst du diesen Tag, indem du das Wort <b>head</b> in Klammern setzt: <code>&lt;head&gt;</code>.",
        hint: "Schreibe '<', dann 'head', dann '>'.",
        desc: "Tippe exakt: <head>",
        check: function(input) {
            return input.toLowerCase().indexOf("<head>") !== -1;
        }
    },
    {
        id: "L3-TITLE",
        title: "Floor 3: Der Seitentitel",
        info: "Im head-Bereich legst du den Namen deiner Webseite fest.<br><br>Dieser Name erscheint ganz oben im Tab deines Browsers. Der Tag dafür lautet <b>title</b>.<br><br>Setze das Wort <b>title</b> in Klammern: <code>&lt;title&gt;</code>.",
        hint: "Kombiniere '<', 'title' und '>'.",
        desc: "Tippe exakt: <title>",
        check: function(input) {
            return input.toLowerCase().indexOf("<title>") !== -1;
        }
    },
    {
        id: "L4-BODY",
        title: "Floor 4: Der Body-Bereich",
        info: "Jetzt wechseln wir zum sichtbaren Teil der Webseite!<br><br>Alles, was ein Besucher auf dem Bildschirm sieht (Text, Bilder, Knöpfe), gehört in den <b>body</b>.<br><br>Der Tag für diesen Bereich lautet <code>&lt;body&gt;</code>.",
        hint: "Schreibe '<', gefolgt von 'body', gefolgt von '>'.",
        desc: "Tippe exakt: <body>",
        check: function(input) {
            return input.toLowerCase().indexOf("<body>") !== -1;
        }
    },
    {
        id: "L5-PARA",
        title: "Floor 5: Absätze",
        info: "Innerhalb des Body-Bereichs schreibst du Textabsätze.<br><br>HTML verwendet dafür den einzelnen Buchstaben <b>p</b> (kurz für 'paragraph').<br><br>Der Tag für einen Absatz lautet <code>&lt;p&gt;</code>.",
        hint: "Schreibe '<', dann 'p', dann '>'.",
        desc: "Tippe exakt: <p>",
        check: function(input) {
            return input.toLowerCase().indexOf("<p>") !== -1;
        }
    }
];

var currentLevel = 0;

// --- MENU TOGGLE FUNCTION ---
function toggleThemeMenu() {
    var menu = document.getElementById("theme-menu");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}

// --- PRESET SELECTION FUNCTION ---
function setPreset(bgHex, textHex) {
    document.getElementById("bg-color-in").value = bgHex;
    document.getElementById("text-color-in").value = textHex;
    applyColors();
}

// --- COLOR CUSTOMIZER FUNCTION ---
function applyColors() {
    var bgVal = document.getElementById("bg-color-in").value;
    var textVal = document.getElementById("text-color-in").value;
    
    document.body.style.backgroundColor = bgVal;
    document.body.style.color = textVal;
    
    var btnEls = document.getElementsByTagName("button");
    for (var j = 0; j < btnEls.length; j++) {
        btnEls[j].style.backgroundColor = textVal;
        btnEls[j].style.color = bgVal;
        btnEls[j].style.borderColor = textVal;
    }

    var ghLink = document.getElementById("gh-link");
    if (ghLink) {
        ghLink.style.backgroundColor = textVal;
        ghLink.style.color = bgVal;
    }

    var playerEls = document.getElementsByClassName ? document.getElementsByClassName("player") : [];
    for (var i = 0; i < playerEls.length; i++) {
        playerEls[i].style.backgroundColor = textVal;
        playerEls[i].style.color = bgVal;
    }
}

// --- ENGINE LOGIC ---
function renderGame() {
    var statusDiv = document.getElementById("status");
    statusDiv.innerHTML = levels[currentLevel].title;

    var infoDiv = document.getElementById("info-text");
    infoDiv.innerHTML = levels[currentLevel].info + 
                        "<br><br><b>HINWEIS:</b> " + levels[currentLevel].hint;

    var taskP = document.getElementById("task-text");
    taskP.innerHTML = "AUFGABE: " + levels[currentLevel].desc;

    // RENDER ONLY PREVIOUS, CURRENT, AND NEXT FLOOR
    var towerDiv = document.getElementById("tower-view");
    var html = "";
    
    var minIdx = Math.max(0, currentLevel - 1);
    var maxIdx = Math.min(levels.length - 1, currentLevel + 1);

    for (var i = maxIdx; i >= minIdx; i--) {
        var marker = (i === currentLevel) ? " [@]" : " [ ]";
        var activeClass = (i === currentLevel) ? " player" : "";
        var labelText = (i === 0) ? "Floor 0 (Anleitung)" : "Floor " + i + " (" + levels[i].id + ")";
        html += '<div class="step' + activeClass + '">' + labelText + marker + '</div>';
    }
    towerDiv.innerHTML = html;
    
    applyColors();
}

function checkCode() {
    var code = document.getElementById("user-code").value;
    var msgBox = document.getElementById("msg-box");
    
    if (levels[currentLevel].check(code)) {
        if (currentLevel < levels.length - 1) {
            msgBox.style.color = document.body.style.color;
            msgBox.innerHTML = "ERFOLG! Code für die nächste Etage: " + levels[currentLevel+1].id;
            currentLevel++;
            document.getElementById("user-code").value = "";
            renderGame();
        } else {
            msgBox.style.color = document.body.style.color;
            msgBox.innerHTML = "TURM SKALIRT! Du hast alle Etagen gemeistert!";
            renderGame();
        }
    } else {
        msgBox.style.color = "#ff3333";
        msgBox.innerHTML = "FALSCH. Überprüfe deine Eingabe und versuche es erneut!";
    }
}

function jumpLevel() {
    var pass = document.getElementById("level-pass").value.toUpperCase();
    var found = -1;
    for (var i = 0; i < levels.length; i++) {
        if (levels[i].id === pass) {
            found = i;
            break;
        }
    }
    var msgBox = document.getElementById("msg-box");
    if (found !== -1) {
        currentLevel = found;
        msgBox.style.color = document.body.style.color;
        msgBox.innerHTML = "Gesprungen zu Etage " + currentLevel + ".";
        document.getElementById("level-pass").value = "";
        renderGame();
    } else {
        msgBox.style.color = "#ff3333";
        msgBox.innerHTML = "Ungültiger Etagen-Code!";
    }
}

// Initial Run
renderGame();
</script>

</body>
</html>
