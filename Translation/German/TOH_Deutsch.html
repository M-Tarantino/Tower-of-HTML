<!DOCTYPE html>
<html lang="de">
<head>
<title>Tower of HTML</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    background-color: #000000;
    color: #00ff00;
    font-family: monospace;
    padding: 10px;
    margin: 0;
}
.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}
.header {
    border-bottom: 1px solid currentColor;
    padding-bottom: 8px;
    margin-bottom: 12px;
}
.header-table {
    width: 100%;
    border-collapse: collapse;
}
.header-left {
    text-align: left;
    vertical-align: middle;
}
.header-right {
    text-align: right;
    vertical-align: middle;
}
h1 {
    font-size: 16px;
    margin: 0;
    display: inline;
}
.top-btn {
    width: auto !important;
    padding: 2px 6px !important;
    margin-left: 6px !important;
    display: inline-block !important;
    font-size: 10px !important;
    vertical-align: middle;
}
.github-btn {
    width: auto !important;
    padding: 2px 6px !important;
    margin-left: 6px !important;
    display: inline-block !important;
    font-size: 10px !important;
    text-decoration: none;
    font-weight: bold;
}
.lang-tag {
    font-size: 11px;
    font-weight: bold;
}
.theme-panel {
    display: none;
    border: 1px solid currentColor;
    padding: 8px;
    margin-bottom: 12px;
    font-size: 11px;
}
.preset-group {
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px dashed currentColor;
}
.theme-panel label {
    margin-right: 10px;
}
.theme-panel input[type="text"] {
    width: 65px;
    background-color: transparent;
    color: inherit;
    border: 1px solid currentColor;
    font-family: monospace;
    font-size: 11px;
    padding: 2px 4px;
}
.tower {
    border: 1px solid currentColor;
    padding: 8px;
    margin-bottom: 10px;
    min-height: 85px;
}
.step {
    border-bottom: 1px dashed currentColor;
    padding: 3px;
    font-size: 12px;
}
.step:last-child {
    border-bottom: none;
}
.player {
    font-weight: bold;
    color: #000000;
    background-color: #00ff00;
}
.info-box {
    border: 1px solid currentColor;
    padding: 10px;
    font-size: 12px;
    margin-bottom: 10px;
    line-height: 1.4;
}
textarea, input[type="text"] {
    width: 100%;
    background-color: transparent;
    color: inherit;
    border: 1px solid currentColor;
    font-family: monospace;
    box-sizing: border-box;
    padding: 6px;
    margin-bottom: 6px;
}
button {
    background-color: #00ff00;
    color: #000000;
    border: 1px solid #00ff00;
    font-family: monospace;
    font-weight: bold;
    width: 100%;
    padding: 10px;
    cursor: pointer;
}
.preset-btn {
    width: auto !important;
    padding: 3px 6px !important;
    margin-right: 3px !important;
    margin-bottom: 3px !important;
    display: inline-block !important;
    font-size: 10px !important;
}
.msg {
    margin-top: 8px;
    font-size: 12px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <!-- HEADER BAR -->
    <div class="header">
        <table class="header-table">
            <tr>
                <td class="header-left">
                    <h1>TOWER OF HTML</h1>
                    <button class="top-btn" onclick="toggleThemeMenu()">[FARBEN]</button>
                </td>
                <td class="header-right">
                    <span class="lang-tag">DE</span>
                    <a href="https://github.com/M-Tarantino" target="_blank" class="github-btn" id="gh-link">@M-Tarantino</a>
                </td>
            </tr>
        </table>
    </div>
    
    <!-- COLLAPSIBLE COLOR MENU -->
    <div class="theme-panel" id="theme-menu">
        <div class="preset-group">
            <span style="font-weight:bold; display:block; margin-bottom:4px;">PRESETS:</span>
            <button class="preset-btn" onclick="setPreset('#000000', '#00ff00')">Matrix</button>
            <button class="preset-btn" onclick="setPreset('#000000', '#ffb000')">Amber</button>
            <button class="preset-btn" onclick="setPreset('#0000aa', '#ffffff')">DOS Blue</button>
            <button class="preset-btn" onclick="setPreset('#ffffff', '#111111')">Light</button>
            <button class="preset-btn" onclick="setPreset('#1a0022', '#00ffff')">Cyber</button>
        </div>
        <div>
            <span style="font-weight:bold;">EIGENE:</span>
            <label>HG: <input type="text" id="bg-color-in" value="#000000" onchange="applyColors()"></label>
            <label>TEXT: <input type="text" id="text-color-in" value="#00ff00" onchange="applyColors()"></label>
            <button class="preset-btn" onclick="applyColors()">SETZEN</button>
        </div>
    </div>

    <div id="status" style="font-size:14px; font-weight:bold; margin-bottom:5px;"></div>
    
    <!-- TOWER VIEW (SHOWING PREVIOUS, CURRENT, AND NEXT FLOOR) -->
    <div class="tower" id="tower-view">
        <!-- Rendered via JS -->
    </div>

    <!-- EXPLANATION BOX -->
    <div class="info-box" id="info-text">
        <!-- Text rendered via JS -->
    </div>

    <div id="task-box">
        <p id="task-text" style="font-size:12px; font-weight:bold; margin: 0 0 5px 0;"></p>
        <textarea id="user-code" rows="3" placeholder="Code hier eingeben..."></textarea>
        <button onclick="checkCode()">CODE PRÜFEN</button>
    </div>

    <div style="margin-top: 15px; border-top: 1px solid currentColor; padding-top: 8px;">
        <p style="font-size:10px; margin:0 0 3px 0;">LEVEL-CODE ZUM SPRINGEN EINGEBEN:</p>
        <input type="text" id="level-pass" placeholder="z. B. START oder L1-ROOT">
        <button onclick="jumpLevel()">ZUM LEVEL SPRINGEN</button>
    </div>

    <div class="msg" id="msg-box"></div>
</div>

<script>
// --- LEVEL DATA (FLOOR 0 INTRO + FLOORS 1 - 40+) ---
var levels = [
    {
        id: "START",
        title: "Level 0: Übersicht & Anleitung",
        info: "Willkommen bei <b>Tower of HTML</b>!<br><br><b>Was ist das?</b><br>Ein interaktives Spiel, das dir Schritt für Schritt die Grundlagen von HTML beibringt.<br><br><b>Wie funktioniert es?</b><br>1. Lies die Erklärung in jedem Level.<br>2. Gib den geforderten HTML-Code in das Feld ein.<br>3. Klicke auf <b>CODE PRÜFEN</b>, um weiterzukommen.<br>4. Du erhältst einen Code, um deinen Fortschritt zu speichern oder zu gelösten Leveln zu springen.",
        hint: "Gib das Wort <b>START</b> ein, um den Tower zu betreten.",
        desc: "Exakte Zeichen eingeben: START",
        check: function(input) {
            return input.toLowerCase().indexOf("start") !== -1;
        }
    },
    // --- PHASE 1: FOUNDATION (Floors 1-8) ---
    {
        id: "L1-ROOT",
        title: "Level 1: Das Root-Element",
        info: "Code besteht aus Anweisungen, die vom Browser gelesen werden.<br><br>HTML baut Webseiten mithilfe von <b>Tags</b> auf. Ein Tag ist ein Schlüsselwort in zwei Klammern:<br>• <b>&lt;</b> (Kleiner-als-Zeichen)<br>• <b>&gt;</b> (Größer-als-Zeichen)<br><br>Der allererste Tag jeder Webseite ist <b>html</b>. Mit Klammern geschrieben sieht er so aus: <code>&lt;html&gt;</code>.",
        hint: "Nutze die Tasten '<' und '>' auf deiner Tastatur.",
        desc: "Exakte Zeichen eingeben: <html>",
        check: function(input) {
            return input.toLowerCase().indexOf("<html>") !== -1;
        }
    },
    {
        id: "L2-HEAD",
        title: "Level 2: Der Head-Bereich",
        info: "Webseiten sind in zwei Hauptbereiche unterteilt: unsichtbare Konfiguration und sichtbarer Inhalt.<br><br>Der unsichtbare Bereich heißt <b>head</b>. Er enthält Einstellungen und Metadaten für den Browser.<br><br>Genau wie in Level 1 schreibst du diesen Tag, indem du das Wort <b>head</b> in Klammern setzt: <code>&lt;head&gt;</code>.",
        hint: "Gib '<', dann 'head', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <head>",
        check: function(input) {
            return input.toLowerCase().indexOf("<head>") !== -1;
        }
    },
    {
        id: "L3-TITLE",
        title: "Level 3: Der Seitentitel",
        info: "Im Head-Bereich legst du den Namen deiner Webseite fest.<br><br>Dieser Name erscheint ganz oben im Browser-Tab. Der Tag dafür lautet <b>title</b>.<br><br>Umschließe das Wort <b>title</b> mit Klammern: <code>&lt;title&gt;</code>.",
        hint: "Kombiniere '<', 'title' und '>'.",
        desc: "Exakte Zeichen eingeben: <title>",
        check: function(input) {
            return input.toLowerCase().indexOf("<title>") !== -1;
        }
    },
    {
        id: "L4-BODY",
        title: "Level 4: Der Body-Bereich",
        info: "Jetzt wechseln wir zum sichtbaren Teil der Webseite!<br><br>Alles, was auf dem Bildschirm angezeigt wird (Text, Bilder, Buttons), gehört in den <b>body</b>.<br><br>Der Tag für diesen Bereich lautet <code>&lt;body&gt;</code>.",
        hint: "Gib '<', gefolgt von 'body', gefolgt von '>' ein.",
        desc: "Exakte Zeichen eingeben: <body>",
        check: function(input) {
            return input.toLowerCase().indexOf("<body>") !== -1;
        }
    },
    {
        id: "L5-PARA",
        title: "Level 5: Textabsätze (Paragraphs)",
        info: "Im Body-Bereich schreibst du Textabsätze.<br><br>HTML nutzt dafür den Buchstaben <b>p</b> (kurz für 'paragraph').<br><br>Der Tag für einen Absatz lautet <code>&lt;p&gt;</code>.",
        hint: "Gib '<', dann 'p', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <p>",
        check: function(input) {
            return input.toLowerCase().indexOf("<p>") !== -1;
        }
    },
    {
        id: "L6-CLOSE-P",
        title: "Level 6: Tags schließen (Paragraph)",
        info: "Die meisten HTML-Tags müssen wieder <b>geschlossen</b> werden.<br><br>Dafür nutzt du dasselbe Wort wie beim öffnenden Tag, setzt aber einen Slash <b>/</b> davor.<br><br>Um einen Paragraph-Tag zu schließen, schreibst du: <code>&lt;/p&gt;</code><br><br>Beispiel für einen vollständigen Absatz:<br><code>&lt;p&gt;Hello World&lt;/p&gt;</code>",
        hint: "Gib '<', dann '/', dann 'p', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: </p>",
        check: function(input) {
            return input.toLowerCase().indexOf("</p>") !== -1;
        }
    },
    {
        id: "L7-CLOSE-BODY",
        title: "Level 7: Body-Tag schließen",
        info: "Genau wie der Paragraph-Tag muss auch der Body-Bereich geschlossen werden, wenn der Inhalt komplett ist.<br><br>Der schließende Body-Tag lautet: <code>&lt;/body&gt;</code><br><br>Merke: Jeder öffnende Tag braucht einen schließenden Tag!",
        hint: "Gib '<', dann '/', dann 'body', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: </body>",
        check: function(input) {
            return input.toLowerCase().indexOf("</body>") !== -1;
        }
    },
    {
        id: "L8-CLOSE-HTML",
        title: "Level 8: HTML-Tag schließen",
        info: "Der allererste Tag war <code>&lt;html&gt;</code>. Jetzt schließt du das gesamte Dokument.<br><br>Der schließende HTML-Tag lautet: <code>&lt;/html&gt;</code><br><br>Damit ist die Grundstruktur deiner Webseite komplett.",
        hint: "Gib '<', dann '/', dann 'html', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: </html>",
        check: function(input) {
            return input.toLowerCase().indexOf("</html>") !== -1;
        }
    },
    // --- PHASE 2: CONTENT & TEXT (Floors 9-18) ---
    {
        id: "L9-H1",
        title: "Level 9: Hauptüberschrift (H1)",
        info: "Überschriften strukturieren deinen Inhalt und heben Titel hervor.<br><br>Die größte Überschrift ist <b>h1</b> (h = heading, 1 = Stufe).<br><br>HTML hat 6 Überschriften-Ebenen: h1 (am größten) bis h6 (am kleinsten).<br><br>Erstelle eine h1-Überschrift mit: <code>&lt;h1&gt;</code>",
        hint: "Gib '<', dann 'h1', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <h1>",
        check: function(input) {
            return input.toLowerCase().indexOf("<h1>") !== -1;
        }
    },
    {
        id: "L10-H2",
        title: "Level 10: Unterüberschrift (H2)",
        info: "Eine Stufe unter h1 liegt die Unterüberschrift <b>h2</b>.<br><br>Nutze h2 für Abschnitte unter deiner Hauptüberschrift.<br><br>Beispiel:<br><code>&lt;h1&gt;Meine Webseite&lt;/h1&gt;</code><br><code>&lt;h2&gt;Über mich&lt;/h2&gt;</code>",
        hint: "Gib '<', dann 'h2', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <h2>",
        check: function(input) {
            return input.toLowerCase().indexOf("<h2>") !== -1;
        }
    },
    {
        id: "L11-CLOSE-H1",
        title: "Level 11: Überschrift H1 schließen",
        info: "Wie fast alle Tags müssen auch Überschriften geschlossen werden.<br><br>Schließe den h1-Tag mit: <code>&lt;/h1&gt;</code><br><br>Beispiel:<br><code>&lt;h1&gt;Willkommen!&lt;/h1&gt;</code>",
        hint: "Gib '<', dann '/', dann 'h1', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: </h1>",
        check: function(input) {
            return input.toLowerCase().indexOf("</h1>") !== -1;
        }
    },
    {
        id: "L12-BOLD",
        title: "Level 12: Fettgedruckter Text (Bold)",
        info: "Um Text <b>fett</b> zu drucken, nutzt du den <b>b</b>-Tag.<br><br>Das b steht für 'bold'.<br><br>Beispiel:<br><code>&lt;p&gt;Das ist &lt;b&gt;wichtiger&lt;/b&gt; Text.&lt;/p&gt;</code>",
        hint: "Gib '<', dann 'b', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <b>",
        check: function(input) {
            return input.toLowerCase().indexOf("<b>") !== -1;
        }
    },
    {
        id: "L13-CLOSE-BOLD",
        title: "Level 13: Bold-Tag schließen",
        info: "Schließe den Bold-Tag mit: <code>&lt;/b&gt;</code><br><br>Vergiss nicht, Tags direkt nach dem betroffenen Wort wieder zu schließen!",
        hint: "Gib '<', dann '/', dann 'b', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: </b>",
        check: function(input) {
            return input.toLowerCase().indexOf("</b>") !== -1;
        }
    },
    {
        id: "L14-ITALIC",
        title: "Level 14: Kursiver Text (Italic)",
        info: "Um Text <i>kursiv</i> zu stellen, nutzt du den <b>i</b>-Tag.<br><br>Das i steht für 'italic'.<br><br>Beispiel:<br><code>&lt;p&gt;Das ist &lt;i&gt;besonderer&lt;/i&gt; Text.&lt;/p&gt;</code>",
        hint: "Gib '<', dann 'i', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <i>",
        check: function(input) {
            return input.toLowerCase().indexOf("<i>") !== -1;
        }
    },
    {
        id: "L15-CLOSE-ITALIC",
        title: "Level 15: Italic-Tag schließen",
        info: "Schließe den Italic-Tag mit: <code>&lt;/i&gt;</code>",
        hint: "Gib '<', dann '/', dann 'i', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: </i>",
        check: function(input) {
            return input.toLowerCase().indexOf("</i>") !== -1;
        }
    },
    {
        id: "L16-STRONG",
        title: "Level 16: Starke Betonung (Strong)",
        info: "Ähnlich wie b hebt der <b>strong</b>-Tag Text hervor.<br><br>Er ist semantisch wichtiger als b – er signalisiert dem Browser und Screenreadern eine <b>hohe Wichtigkeit</b>.<br><br>Beispiel:<br><code>&lt;p&gt;&lt;strong&gt;Achtung:&lt;/strong&gt; Wichtiger Hinweis!&lt;/p&gt;</code>",
        hint: "Gib '<', dann 'strong', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <strong>",
        check: function(input) {
            return input.toLowerCase().indexOf("<strong>") !== -1;
        }
    },
    {
        id: "L17-CLOSE-STRONG",
        title: "Level 17: Strong-Tag schließen",
        info: "Schließe den Strong-Tag mit: <code>&lt;/strong&gt;</code>",
        hint: "Gib '<', dann '/', dann 'strong', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: </strong>",
        check: function(input) {
            return input.toLowerCase().indexOf("</strong>") !== -1;
        }
    },
    {
        id: "L18-EM",
        title: "Level 18: Hervorhebung (EM)",
        info: "Der <b>em</b>-Tag betont Text (wird meist kursiv dargestellt).<br><br>Semantisch steht em für 'emphasis' (Betonung).<br><br>Beispiel:<br><code>&lt;p&gt;Ich liebe Coden &lt;em&gt;wirklich&lt;/em&gt;!&lt;/p&gt;</code>",
        hint: "Gib '<', dann 'em', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <em>",
        check: function(input) {
            return input.toLowerCase().indexOf("<em>") !== -1;
        }
    },
    // --- PHASE 3: LINKS & MEDIA (Floors 19-28) ---
    {
        id: "L19-ANCHOR",
        title: "Level 19: Link-Tag (Anchor)",
        info: "Für klickbare <b>Links</b> nutzt du den <b>a</b>-Tag.<br><br>Das a steht für 'anchor' (Anker).<br><br>Beispiel:<br><code>&lt;a&gt;Klick mich&lt;/a&gt;</code>",
        hint: "Gib '<', dann 'a', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <a>",
        check: function(input) {
            return input.toLowerCase().indexOf("<a>") !== -1;
        }
    },
    {
        id: "L20-HREF",
        title: "Level 20: Link-Ziel (HREF)",
        info: "Links brauchen ein Ziel! Das <b>href</b>-Attribut gibt die URL an.<br><br><b>Attribute</b> sind Zusatzangaben innerhalb eines Tags.<br><br>Beispiel:<br><code>&lt;a href=\"https://google.com\"&gt;Google&lt;/a&gt;</code><br><br>Schreibe den Tag mit href-Attribut auf google.com",
        hint: "Nutze: <a href=\"https://google.com\">",
        desc: 'Eingeben: <a href="https://google.com">',
        check: function(input) {
            var lower = input.toLowerCase();
            return lower.indexOf("<a") !== -1 && lower.indexOf("href") !== -1 && lower.indexOf("google.com") !== -1;
        }
    },
    {
        id: "L21-CLOSE-ANCHOR",
        title: "Level 21: Link-Tag schließen",
        info: "Schließe den Anchor-Tag mit: <code>&lt;/a&gt;</code><br><br>Beispiel:<br><code>&lt;a href=\"https://google.com\"&gt;Zu Google&lt;/a&gt;</code>",
        hint: "Gib '<', dann '/', dann 'a', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: </a>",
        check: function(input) {
            return input.toLowerCase().indexOf("</a>") !== -1;
        }
    },
    {
        id: "L22-IMG",
        title: "Level 22: Bild-Tag (IMG)",
        info: "Um Bilder einzubinden, nutzt du den <b>img</b>-Tag.<br><br>Der img-Tag ist <b>self-closing</b> (selbstschließend) – er braucht keinen End-Tag!<br><br>Beispiel:<br><code>&lt;img src=\"photo.jpg\"&gt;</code><br><br>Hinweis: Kein &lt;/img&gt; nötig!",
        hint: "Gib '<', dann 'img', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <img>",
        check: function(input) {
            return input.toLowerCase().indexOf("<img>") !== -1;
        }
    },
    {
        id: "L23-SRC",
        title: "Level 23: Bildquelle (SRC)",
        info: "Bilder brauchen einen Dateipfad! Das <b>src</b>-Attribut gibt die Quelle (Source) an.<br><br>Beispiel:<br><code>&lt;img src=\"cat.jpg\"&gt;</code><br><br>Schreibe den img-Tag mit src auf 'cat.jpg'",
        hint: "Nutze: <img src=\"cat.jpg\">",
        desc: 'Eingeben: <img src="cat.jpg">',
        check: function(input) {
            var lower = input.toLowerCase();
            return lower.indexOf("<img") !== -1 && lower.indexOf("src") !== -1 && lower.indexOf("cat.jpg") !== -1;
        }
    },
    {
        id: "L24-ALT",
        title: "Level 24: Bild-Alt-Text",
        info: "Das <b>alt</b>-Attribut beschreibt das Bild als Text.<br><br>Wichtig für:<br>• Barrierefreiheit (Screenreader)<br>• Fallback, falls das Bild nicht lädt<br><br>Beispiel:<br><code>&lt;img src=\"cat.jpg\" alt=\"A cute orange cat\"&gt;</code><br><br>Schreibe den img-Tag mit src und alt.",
        hint: "Nutze: <img src=\"cat.jpg\" alt=\"A cute orange cat\">",
        desc: 'Eingeben: <img src="cat.jpg" alt="A cute orange cat">',
        check: function(input) {
            var lower = input.toLowerCase();
            return lower.indexOf("<img") !== -1 && lower.indexOf("src") !== -1 && lower.indexOf("alt") !== -1;
        }
    },
    {
        id: "L25-BR",
        title: "Level 25: Zeilenumbruch (BR)",
        info: "Für einen einfachen Zeilenumbruch im Text nutzt du <b>br</b> (Break).<br><br>Der br-Tag ist ebenfalls <b>self-closing</b>!<br><br>Beispiel:<br><code>&lt;p&gt;Zeile 1&lt;br&gt;Zeile 2&lt;/p&gt;</code>",
        hint: "Gib '<', dann 'br', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <br>",
        check: function(input) {
            return input.toLowerCase().indexOf("<br>") !== -1;
        }
    },
    {
        id: "L26-HR",
        title: "Level 26: Trennlinie (HR)",
        info: "Eine horizontale Linie zur Trennung von Inhalten erzeugst du mit <b>hr</b> (Horizontal Rule).<br><br>Dieser Tag ist <b>self-closing</b>.<br><br>Beispiel:<br><code>&lt;hr&gt;</code>",
        hint: "Gib '<', dann 'hr', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <hr>",
        check: function(input) {
            return input.toLowerCase().indexOf("<hr>") !== -1;
        }
    },
    {
        id: "L27-BUTTON",
        title: "Level 27: Button-Element",
        info: "Einen klickbaren Button erstellst du mit dem <b>button</b>-Tag.<br><br>Buttons werden oft in Formularen oder für Skripte genutzt.<br><br>Beispiel:<br><code>&lt;button&gt;Click Me!&lt;/button&gt;</code>",
        hint: "Gib '<', dann 'button', dann '>' ein.",
        desc: "Exakte Zeichen eingeben: <button>",
        check: function(input) {
            return input.toLowerCase().indexOf("<button>") !== -1;
        }
    },
    {
        id: "L28-CLOSE-BUTTON",
        title: "Level 28: Button-Tag schließen",

var currentLevel = 0;

// --- MENU TOGGLE FUNCTION ---
function toggleThemeMenu() {
    var menu = document.getElementById("theme-menu");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}

// --- PRESET SELECTION FUNCTION ---
function setPreset(bgHex, textHex) {
    document.getElementById("bg-color-in").value = bgHex;
    document.getElementById("text-color-in").value = textHex;
    applyColors();
}

// --- COLOR CUSTOMIZER FUNCTION ---
function applyColors() {
    var bgVal = document.getElementById("bg-color-in").value;
    var textVal = document.getElementById("text-color-in").value;
    
    document.body.style.backgroundColor = bgVal;
    document.body.style.color = textVal;
    
    var btnEls = document.getElementsByTagName("button");
    for (var j = 0; j < btnEls.length; j++) {
        btnEls[j].style.backgroundColor = textVal;
        btnEls[j].style.color = bgVal;
        btnEls[j].style.borderColor = textVal;
    }

    var ghLink = document.getElementById("gh-link");
    if (ghLink) {
        ghLink.style.backgroundColor = textVal;
        ghLink.style.color = bgVal;
    }

    var playerEls = document.getElementsByClassName ? document.getElementsByClassName("player") : [];
    for (var i = 0; i < playerEls.length; i++) {
        playerEls[i].style.backgroundColor = textVal;
        playerEls[i].style.color = bgVal;
    }
}

// --- ENGINE LOGIC ---
function renderGame() {
    var statusDiv = document.getElementById("status");
    statusDiv.innerHTML = levels[currentLevel].title;

    var infoDiv = document.getElementById("info-text");
    infoDiv.innerHTML = levels[currentLevel].info + 
                        "<br><br><b>TIPP:</b> " + levels[currentLevel].hint;

    var taskP = document.getElementById("task-text");
    taskP.innerHTML = "AUFGABE: " + levels[currentLevel].desc;

    // RENDER ONLY PREVIOUS, CURRENT, AND NEXT FLOOR
    var towerDiv = document.getElementById("tower-view");
    var html = "";
    
    var minIdx = Math.max(0, currentLevel - 1);
    var maxIdx = Math.min(levels.length - 1, currentLevel + 1);

    for (var i = maxIdx; i >= minIdx; i--) {
        var marker = (i === currentLevel) ? " [@]" : " [ ]";
        var activeClass = (i === currentLevel) ? " player" : "";
        var labelText = (i === 0) ? "Level 0 (Intro)" : "Level " + i + " (" + levels[i].id + ")";
        html += '<div class="step' + activeClass + '">' + labelText + marker + '</div>';
    }
    towerDiv.innerHTML = html;
    
    applyColors();
}

function checkCode() {
    var code = document.getElementById("user-code").value;
    var msgBox = document.getElementById("msg-box");
    
    if (levels[currentLevel].check(code)) {
        if (currentLevel < levels.length - 1) {
            msgBox.style.color = document.body.style.color;
            msgBox.innerHTML = "RICHTIG! Code für das nächste Level: " + levels[currentLevel+1].id;
            currentLevel++;
            document.getElementById("user-code").value = "";
            renderGame();
        } else {
            msgBox.style.color = document.body.style.color;
            msgBox.innerHTML = "🏆 TOWER GEKNACKT! Du hast HTML gemeistert! 🏆";
            renderGame();
        }
    } else {
        msgBox.style.color = "#ff3333";
        msgBox.innerHTML = "FALSCH. Überprüfe deinen Code und versuche es nochmal!";
    }
}

function jumpLevel() {
    var pass = document.getElementById("level-pass").value.toUpperCase();
    var found = -1;
    for (var i = 0; i < levels.length; i++) {
        if (levels[i].id === pass) {
            found = i;
            break;
        }
    }
    var msgBox = document.getElementById("msg-box");
    if (found !== -1) {
        currentLevel = found;
        msgBox.style.color = document.body.style.color;
        msgBox.innerHTML = "Gesprungen zu Level " + currentLevel + ".";
        document.getElementById("level-pass").value = "";
        renderGame();
    } else {
        msgBox.style.color = "#ff3333";
        msgBox.innerHTML = "Ungültiger Level-Code!";
    }
}

// Initial Run
renderGame();
