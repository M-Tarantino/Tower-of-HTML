<!DOCTYPE html>
<html lang="ha">
<head>
<title>Tower of HTML</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    background-color: #000000;
    color: #00ff00;
    font-family: monospace;
    padding: 10px;
    margin: 0;
}
.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}
.header {
    border-bottom: 1px solid currentColor;
    padding-bottom: 8px;
    margin-bottom: 12px;
}
.header-table {
    width: 100%;
    border-collapse: collapse;
}
.header-left {
    text-align: left;
    vertical-align: middle;
}
.header-right {
    text-align: right;
    vertical-align: middle;
}
h1 {
    font-size: 16px;
    margin: 0;
    display: inline;
}
.top-btn {
    width: auto !important;
    padding: 2px 6px !important;
    margin-left: 6px !important;
    display: inline-block !important;
    font-size: 10px !important;
    vertical-align: middle;
}
.github-btn {
    width: auto !important;
    padding: 2px 6px !important;
    margin-left: 6px !important;
    display: inline-block !important;
    font-size: 10px !important;
    text-decoration: none;
    font-weight: bold;
}
.lang-tag {
    font-size: 11px;
    font-weight: bold;
}
.theme-panel {
    display: none;
    border: 1px solid currentColor;
    padding: 8px;
    margin-bottom: 12px;
    font-size: 11px;
}
.preset-group {
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px dashed currentColor;
}
.theme-panel label {
    margin-right: 10px;
}
.theme-panel input[type="text"] {
    width: 65px;
    background-color: transparent;
    color: inherit;
    border: 1px solid currentColor;
    font-family: monospace;
    font-size: 11px;
    padding: 2px 4px;
}
.tower {
    border: 1px solid currentColor;
    padding: 8px;
    margin-bottom: 10px;
    min-height: 85px;
}
.step {
    border-bottom: 1px dashed currentColor;
    padding: 3px;
    font-size: 12px;
}
.step:last-child {
    border-bottom: none;
}
.player {
    font-weight: bold;
    color: #000000;
    background-color: #00ff00;
}
.info-box {
    border: 1px solid currentColor;
    padding: 10px;
    font-size: 12px;
    margin-bottom: 10px;
    line-height: 1.4;
}
textarea, input[type="text"] {
    width: 100%;
    background-color: transparent;
    color: inherit;
    border: 1px solid currentColor;
    font-family: monospace;
    box-sizing: border-box;
    padding: 6px;
    margin-bottom: 6px;
}
button {
    background-color: #00ff00;
    color: #000000;
    border: 1px solid #00ff00;
    font-family: monospace;
    font-weight: bold;
    width: 100%;
    padding: 10px;
    cursor: pointer;
}
.preset-btn {
    width: auto !important;
    padding: 3px 6px !important;
    margin-right: 3px !important;
    margin-bottom: 3px !important;
    display: inline-block !important;
    font-size: 10px !important;
}
.msg {
    margin-top: 8px;
    font-size: 12px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <!-- HEADER BAR -->
    <div class="header">
        <table class="header-table">
            <tr>
                <td class="header-left">
                    <h1>Hasumiya HTML</h1>
                    <button class="top-btn" onclick="toggleThemeMenu()">[LAUNUKA]</button>
                </td>
                <td class="header-right">
                    <span class="lang-tag">EN</span>
                    <a href="https://github.com/M-Tarantino" target="_blank" class="github-btn" id="gh-link">@M-Tarantino</a>
                </td>
            </tr>
        </table>
    </div>
    
    <!-- COLLAPSIBLE COLOR MENU -->
    <div class="theme-panel" id="theme-menu">
        <div class="preset-group">
            <span style="font-weight:bold; display:block; margin-bottom:4px;">SHIRYE:</span>
            <button class="preset-btn" onclick="setPreset('#000000', '#00ff00')">Matrix</button>
            <button class="preset-btn" onclick="setPreset('#000000', '#ffb000')">Amber</button>
            <button class="preset-btn" onclick="setPreset('#0000aa', '#ffffff')">DOS Baba</button>
            <button class="preset-btn" onclick="setPreset('#ffffff', '#111111')">Haske</button>
            <button class="preset-btn" onclick="setPreset('#1a0022', '#00ffff')">Cyber</button>
        </div>
        <div>
            <span style="font-weight:bold;">GIDA:</span>
            <label>BG: <input type="text" id="bg-color-in" value="#000000" onchange="applyColors()"></label>
            <label>RUBUTU: <input type="text" id="text-color-in" value="#00ff00" onchange="applyColors()"></label>
            <button class="preset-btn" onclick="applyColors()">SAITA</button>
        </div>
    </div>

    <div id="status" style="font-size:14px; font-weight:bold; margin-bottom:5px;"></div>
    
    <!-- TOWER VIEW (SHOWING PREVIOUS, CURRENT, AND NEXT FLOOR) -->
    <div class="tower" id="tower-view">
        <!-- Rendered via JS -->
    </div>

    <!-- EXPLANATION BOX -->
    <div class="info-box" id="info-text">
        <!-- Text rendered via JS -->
    </div>

    <div id="task-box">
        <p id="task-text" style="font-size:12px; font-weight:bold; margin: 0 0 5px 0;"></p>
        <textarea id="user-code" rows="3" placeholder="Rubuta kodarka a nan..."></textarea>
        <button onclick="checkCode()">DUBA KODIYA</button>
    </div>

    <div style="margin-top: 15px; border-top: 1px solid currentColor; padding-top: 8px;">
        <p style="font-size:10px; margin:0 0 3px 0;">SHIGAR DA NAMBARI NA DARI DOMIN TSALLOWA:</p>
        <input type="text" id="level-pass" placeholder="kamar START ko L1-ROOT">
        <button onclick="jumpLevel()">TSALLOWA ZUWA DARI</button>
    </div>

    <div class="msg" id="msg-box"></div>
</div>

<script>
// --- LEVEL DATA (FLOOR 0 INTRO + FLOORS 1 - 40+) ---
var levels = [
    {
        id: "START",
        title: "Dari 0: Overview & Instructions",
        info: "Welcome to <b>Tower of HTML</b>!<br><br><b>What is this?</b><br>An interactive game designed to teach you the fundamentals of HTML step by step.<br><br><b>How does it work?</b><br>1. Read the explanation on each floor.<br>2. Type the requested HTML code into the input field.<br>3. Click <b>DUBA KODIYA</b> to advance.<br>4. You will receive a code to save your progress or jump to completed floors.",
        hint: "Type the word <b>START</b> to enter the tower.",
        desc: "Type exact characters: START",
        check: function(input) {
            return input.toLowerCase().indexOf("start") !== -1;
        }
    },
    // --- PHASE 1: FOUNDATION (Floors 1-8) ---
    {
        id: "L1-ROOT",
        title: "Dari 1: The Root Element",
        info: "Code consists of instructions read by the browser.<br><br>HTML builds webpages using <b>Tags</b>. A tag is a keyword placed inside two bracket symbols:<br>• <b>&lt;</b> (less-than symbol)<br>• <b>&gt;</b> (greater-than symbol)<br><br>The very first tag of every webpage is <b>html</b>. Written with brackets, it looks like: <code>&lt;html&gt;</code>.",
        hint: "Use the '<' and '>' keys on your keyboard.",
        desc: "Type exact characters: <html lang="ha">",
        check: function(input) {
            return input.toLowerCase().indexOf("<html lang="ha">") !== -1;
        }
    },
    {
        id: "L2-HEAD",
        title: "Dari 2: The Head Section",
        info: "Webpages are split into two main sections: invisible configuration and visible content.<br><br>The invisible section is called <b>head</b>. It contains settings and metadata for the browser.<br><br>Just like Dari 1, you write this tag by wrapping the word <b>head</b> in brackets: <code>&lt;head&gt;</code>.",
        hint: "Type '<', then 'head', then '>'.",
        desc: "Type exact characters: <head>",
        check: function(input) {
            return input.toLowerCase().indexOf("<head>") !== -1;
        }
    },
    {
        id: "L3-TITLE",
        title: "Dari 3: Page Title",
        info: "Inside the head section, you set the name of your webpage.<br><br>This name appears on the tab at the top of your web browser. The tag for this is <b>title</b>.<br><br>Wrap the word <b>title</b> in brackets: <code>&lt;title&gt;</code>.",
        hint: "Combine '<', 'title', and '>'.",
        desc: "Type exact characters: <title>",
        check: function(input) {
            return input.toLowerCase().indexOf("<title>") !== -1;
        }
    },
    {
        id: "L4-BODY",
        title: "Dari 4: The Body Section",
        info: "Now we move to the visible part of the website!<br><br>Everything displayed on screen (text, images, buttons) belongs inside the <b>body</b>.<br><br>The tag for this section is <code>&lt;body&gt;</code>.",
        hint: "Type '<', followed by 'body', followed by '>'",
        desc: "Type exact characters: <body>",
        check: function(input) {
            return input.toLowerCase().indexOf("<body>") !== -1;
        }
    },
    {
        id: "L5-PARA",
        title: "Dari 5: Paragraphs",
        info: "Inside the body section, you write text paragraphs.<br><br>HTML uses the single letter <b>p</b> (short for 'paragraph').<br><br>The tag for a paragraph is <code>&lt;p&gt;</code>.",
        hint: "Type '<', then 'p', then '>'.",
        desc: "Type exact characters: <p>",
        check: function(input) {
            return input.toLowerCase().indexOf("<p>") !== -1;
        }
    },
    {
        id: "L6-CLOSE-P",
        title: "Dari 6: Closing Tags (Paragraph)",
        info: "Most HTML tags must be <b>closed</b> when you're done with them.<br><br>To close a tag, use the same word as the opening tag, but add a forward slash <b>/</b> at the beginning.<br><br>To close a paragraph tag, write: <code>&lt;/p&gt;</code><br><br>Example of a complete paragraph:<br><code>&lt;p&gt;Hello World&lt;/p&gt;</code>",
        hint: "Type '<', then '/', then 'p', then '>'.",
        desc: "Type exact characters: </p>",
        check: function(input) {
            return input.toLowerCase().indexOf("</p>") !== -1;
        }
    },
    {
        id: "L7-CLOSE-BODY",
        title: "Dari 7: Closing Body Tag",
        info: "Just like the paragraph tag, the body section must be closed when you're done adding content.<br><br>The closing body tag is: <code>&lt;/body&gt;</code><br><br>Remember: Every opening tag needs a closing tag!",
        hint: "Type '<', then '/', then 'body', then '>'.",
        desc: "Type exact characters: </body>",
        check: function(input) {
            return input.toLowerCase().indexOf("</body>") !== -1;
        }
    },
    {
        id: "L8-CLOSE-HTML",
        title: "Dari 8: Closing HTML Tag",
        info: "The very first tag you opened was <code>&lt;html&gt;</code>. Now you must close it.<br><br>The closing html tag is: <code>&lt;/html&gt;</code><br><br>This closes the entire webpage structure.",
        hint: "Type '<', then '/', then 'html', then '>'.",
        desc: "Type exact characters: </html>",
        check: function(input) {
            return input.toLowerCase().indexOf("</html>") !== -1;
        }
    },
    // --- PHASE 2: CONTENT & TEXT (Floors 9-18) ---
    {
        id: "L9-H1",
        title: "Dari 9: Main Heading (H1)",
        info: "Headings are used to organize content and make titles stand out.<br><br>The largest heading is <b>h1</b> (h = heading, 1 = size level).<br><br>HTML has 6 heading levels: h1 (largest) through h6 (smallest).<br><br>Create an h1 heading with: <code>&lt;h1&gt;</code>",
        hint: "Type '<', then 'h1', then '>'.",
        desc: "Type exact characters: <h1>",
        check: function(input) {
            return input.toLowerCase().indexOf("<h1>") !== -1;
        }
    },
    {
        id: "L10-H2",
        title: "Dari 10: Subheading (H2)",
        info: "Below h1, the next heading size is <b>h2</b>.<br><br>Use h2 for section titles under your main heading.<br><br>Example structure:<br><code>&lt;h1&gt;My Website&lt;/h1&gt;</code><br><code>&lt;h2&gt;About Me&lt;/h2&gt;</code>",
        hint: "Type '<', then 'h2', then '>'.",
        desc: "Type exact characters: <h2>",
        check: function(input) {
            return input.toLowerCase().indexOf("<h2>") !== -1;
        }
    },
    {
        id: "L11-CLOSE-H1",
        title: "Dari 11: Close Heading H1",
        info: "Like all HTML tags, headings must be closed.<br><br>To close an h1 tag, write: <code>&lt;/h1&gt;</code><br><br>Complete example:<br><code>&lt;h1&gt;Welcome!&lt;/h1&gt;</code>",
        hint: "Type '<', then '/', then 'h1', then '>'.",
        desc: "Type exact characters: </h1>",
        check: function(input) {
            return input.toLowerCase().indexOf("</h1>") !== -1;
        }
    },
    {
        id: "L12-BOLD",
        title: "Dari 12: Bold Text",
        info: "To make text <b>bold</b> (thicker, darker), use the <b>b</b> tag.<br><br>The b stands for 'bold'.<br><br>Example:<br><code>&lt;p&gt;This is &lt;b&gt;important&lt;/b&gt; text.&lt;/p&gt;</code>",
        hint: "Type '<', then 'b', then '>'.",
        desc: "Type exact characters: <b>",
        check: function(input) {
            return input.toLowerCase().indexOf("<b>") !== -1;
        }
    },
    {
        id: "L13-CLOSE-BOLD",
        title: "Dari 13: Close Bold Tag",
        info: "Close the bold tag with: <code>&lt;/b&gt;</code><br><br>Remember to close tags right after the content you want formatted!",
        hint: "Type '<', then '/', then 'b', then '>'.",
        desc: "Type exact characters: </b>",
        check: function(input) {
            return input.toLowerCase().indexOf("</b>") !== -1;
        }
    },
    {
        id: "L14-ITALIC",
        title: "Dari 14: Italic Text",
        info: "To make text <i>italic</i> (slanted), use the <b>i</b> tag.<br><br>The i stands for 'italic'.<br><br>Example:<br><code>&lt;p&gt;This is &lt;i&gt;fancy&lt;/i&gt; text.&lt;/p&gt;</code>",
        hint: "Type '<', then 'i', then '>'.",
        desc: "Type exact characters: <i>",
        check: function(input) {
            return input.toLowerCase().indexOf("<i>") !== -1;
        }
    },
    {
        id: "L15-CLOSE-ITALIC",
        title: "Dari 15: Close Italic Tag",
        info: "Close the italic tag with: <code>&lt;/i&gt;</code>",
        hint: "Type '<', then '/', then 'i', then '>'.",
        desc: "Type exact characters: </i>",
        check: function(input) {
            return input.toLowerCase().indexOf("</i>") !== -1;
        }
    },
    {
        id: "L16-STRONG",
        title: "Dari 16: Strong Emphasis",
        info: "Similar to bold, the <b>strong</b> tag emphasizes text.<br><br>It's semantically stronger than b — it tells the browser this is <b>important</b>.<br><br>Example:<br><code>&lt;p&gt;&lt;strong&gt;Warning:&lt;/strong&gt; Be careful!&lt;/p&gt;</code>",
        hint: "Type '<', then 'strong', then '>'.",
        desc: "Type exact characters: <strong>",
        check: function(input) {
            return input.toLowerCase().indexOf("<strong>") !== -1;
        }
    },
    {
        id: "L17-CLOSE-STRONG",
        title: "Dari 17: Close Strong Tag",
        info: "Close the strong tag with: <code>&lt;/strong&gt;</code>",
        hint: "Type '<', then '/', then 'strong', then '>'.",
        desc: "Type exact characters: </strong>",
        check: function(input) {
            return input.toLowerCase().indexOf("</strong>") !== -1;
        }
    },
    {
        id: "L18-EM",
        title: "Dari 18: Emphasis (EM)",
        info: "The <b>em</b> tag adds emphasis to text (similar to italic).<br><br>It semantically means 'emphasized', so screen readers know it's important.<br><br>Example:<br><code>&lt;p&gt;I &lt;em&gt;really&lt;/em&gt; love coding!&lt;/p&gt;</code>",
        hint: "Type '<', then 'em', then '>'.",
        desc: "Type exact characters: <em>",
        check: function(input) {
            return input.toLowerCase().indexOf("<em>") !== -1;
        }
    },
    // --- PHASE 3: LINKS & MEDIA (Floors 19-28) ---
    {
        id: "L19-ANCHOR",
        title: "Dari 19: Link Tag (Anchor)",
        info: "To create clickable <b>links</b> to other websites, use the <b>a</b> tag.<br><br>The a stands for 'anchor'.<br><br>Example:<br><code>&lt;a&gt;Click me&lt;/a&gt;</code>",
        hint: "Type '<', then 'a', then '>'.",
        desc: "Type exact characters: <a>",
        check: function(input) {
            return input.toLowerCase().indexOf("<a>") !== -1;
        }
    },
    {
        id: "L20-HREF",
        title: "Dari 20: Link Destination (HREF)",
        info: "Links need a destination! Use the <b>href</b> attribute to specify the URL.<br><br><b>Attributes</b> are properties added to tags.<br><br>Example:<br><code>&lt;a href=\"https://google.com\"&gt;Google&lt;/a&gt;</code><br><br>Type the complete tag with href pointing to google.com",
        hint: "Use: <a href=\"https://google.com\">",
        desc: 'Type: <a href="https://google.com">',
        check: function(input) {
            var lower = input.toLowerCase();
            return lower.indexOf("<a") !== -1 && lower.indexOf("href") !== -1 && lower.indexOf("google.com") !== -1;
        }
    },
    {
        id: "L21-CLOSE-ANCHOR",
        title: "Dari 21: Close Link Tag",
        info: "Close the anchor tag with: <code>&lt;/a&gt;</code><br><br>Complete example:<br><code>&lt;a href=\"https://google.com\"&gt;Visit Google&lt;/a&gt;</code>",
        hint: "Type '<', then '/', then 'a', then '>'.",
        desc: "Type exact characters: </a>",
        check: function(input) {
            return input.toLowerCase().indexOf("</a>") !== -1;
        }
    },
    {
        id: "L22-IMG",
        title: "Dari 22: Image Tag",
        info: "To display images, use the <b>img</b> tag.<br><br>The img tag is <b>self-closing</b> — it doesn't need a closing tag!<br><br>Example:<br><code>&lt;img src=\"photo.jpg\"&gt;</code><br><br>Note: No &lt;/img&gt; needed!",
        hint: "Type '<', then 'img', then '>'.",
        desc: "Type exact characters: <img>",
        check: function(input) {
            return input.toLowerCase().indexOf("<img>") !== -1;
        }
    },
    {
        id: "L23-SRC",
        title: "Dari 23: Image Source (SRC)",
        info: "Images need a file to display! Use the <b>src</b> attribute to specify the image file.<br><br>Example:<br><code>&lt;img src=\"cat.jpg\"&gt;</code><br><br>Type the img tag with src attribute pointing to 'cat.jpg'",
        hint: "Use: <img src=\"cat.jpg\">",
        desc: 'Type: <img src="cat.jpg">',
        check: function(input) {
            var lower = input.toLowerCase();
            return lower.indexOf("<img") !== -1 && lower.indexOf("src") !== -1 && lower.indexOf("cat.jpg") !== -1;
        }
    },
    {
        id: "L24-ALT",
        title: "Dari 24: Image Alt Text",
        info: "The <b>alt</b> attribute describes the image in text.<br><br>This helps:<br>• People using screen readers<br>• When the image fails to load<br><br>Example:<br><code>&lt;img src=\"cat.jpg\" alt=\"A cute orange cat\"&gt;</code><br><br>Type the complete img tag with both src and alt.",
        hint: "Use: <img src=\"cat.jpg\" alt=\"A cute orange cat\">",
        desc: 'Type: <img src="cat.jpg" alt="A cute orange cat">',
        check: function(input) {
            var lower = input.toLowerCase();
            return lower.indexOf("<img") !== -1 && lower.indexOf("src") !== -1 && lower.indexOf("alt") !== -1;
        }
    },
    {
        id: "L25-BR",
        title: "Dari 25: Line Break",
        info: "To create a line break without starting a new paragraph, use the <b>br</b> tag.<br><br>The br tag is also <b>self-closing</b>!<br><br>Example:<br><code>&lt;p&gt;Line 1&lt;br&gt;Line 2&lt;/p&gt;</code>",
        hint: "Type '<', then 'br', then '>'.",
        desc: "Type exact characters: <br>",
        check: function(input) {
            return input.toLowerCase().indexOf("<br>") !== -1;
        }
    },
    {
        id: "L26-HR",
        title: "Dari 26: Horizontal Rule",
        info: "To draw a horizontal line (divider) on the page, use the <b>hr</b> tag.<br><br>The hr stands for 'horizontal rule' and is <b>self-closing</b>.<br><br>Example:<br><code>&lt;hr&gt;</code>",
        hint: "Type '<', then 'hr', then '>'.",
        desc: "Type exact characters: <hr>",
        check: function(input) {
            return input.toLowerCase().indexOf("<hr>") !== -1;
        }
    },
    {
        id: "L27-BUTTON",
        title: "Dari 27: Button Element",
        info: "To create a clickable button, use the <b>button</b> tag.<br><br>Buttons are used in forms or to trigger actions.<br><br>Example:<br><code>&lt;button&gt;Click Me!&lt;/button&gt;</code>",
        hint: "Type '<', then 'button', then '>'.",
        desc: "Type exact characters: <button>",
        check: function(input) {
            return input.toLowerCase().indexOf("<button>") !== -1;
        }
    },
    {
        id: "L28-CLOSE-BUTTON",
        title: "Dari 28: Close Button Tag",
        info: "Close the button tag with: <code>&lt;/button&gt;</code><br><br>Complete example:<br><code>&lt;button&gt;Submit&lt;/button&gt;</code>",
        hint: "Type '<', then '/', then 'button', then '>'.",
        desc: "Type exact characters: </button>",
        check: function(input) {
            return input.toLowerCase().indexOf("</button>") !== -1;
        }
    },
    // --- PHASE 4: ORGANIZATION (Floors 29-38) ---
    {
        id: "L29-DIV",
        title: "Dari 29: Division (DIV)",
        info: "The <b>div</b> tag is a container that groups content together.<br><br>div stands for 'division'.<br><br>You'll use divs to organize different sections of your page.<br><br>Example:<br><code>&lt;div&gt;&lt;h1&gt;Section 1&lt;/h1&gt;&lt;/div&gt;</code>",
        hint: "Type '<', then 'div', then '>'.",
        desc: "Type exact characters: <div>",
        check: function(input) {
            return input.toLowerCase().indexOf("<div>") !== -1;
        }
    },
    {
        id: "L30-CLOSE-DIV",
        title: "Dari 30: Close DIV Tag",
        info: "Close the div tag with: <code>&lt;/div&gt;</code><br><br>Remember: Everything inside the div will be grouped together.",
        hint: "Type '<', then '/', then 'div', then '>'.",
        desc: "Type exact characters: </div>",
        check: function(input) {
            return input.toLowerCase().indexOf("</div>") !== -1;
        }
    },
    {
        id: "L31-SPAN",
        title: "Dari 31: Span Element",
        info: "The <b>span</b> tag is a smaller container for inline content.<br><br>Use span to style small parts of text within a paragraph.<br><br>Example:<br><code>&lt;p&gt;This is &lt;span&gt;highlighted&lt;/span&gt; text.&lt;/p&gt;</code>",
        hint: "Type '<', then 'span', then '>'.",
        desc: "Type exact characters: <span>",
        check: function(input) {
            return input.toLowerCase().indexOf("<span>") !== -1;
        }
    },
    {
        id: "L32-CLOSE-SPAN",
        title: "Dari 32: Close Span Tag",
        info: "Close the span tag with: <code>&lt;/span&gt;</code>",
        hint: "Type '<', then '/', then 'span', then '>'.",
        desc: "Type exact characters: </span>",
        check: function(input) {
            return input.toLowerCase().indexOf("</span>") !== -1;
        }
    },
    {
        id: "L33-UL",

var currentLevel = 0;

// --- MENU TOGGLE FUNCTION ---
function toggleThemeMenu() {
    var menu = document.getElementById("theme-menu");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}

// --- PRESAITA SELECTION FUNCTION ---
function setPreset(bgHex, textHex) {
    document.getElementById("bg-color-in").value = bgHex;
    document.getElementById("text-color-in").value = textHex;
    applyColors();
}

// --- COLOR CUSTOMIZER FUNCTION ---
function applyColors() {
    var bgVal = document.getElementById("bg-color-in").value;
    var textVal = document.getElementById("text-color-in").value;
    
    document.body.style.backgroundColor = bgVal;
    document.body.style.color = textVal;
    
    var btnEls = document.getElementsByTagName("button");
    for (var j = 0; j < btnEls.length; j++) {
        btnEls[j].style.backgroundColor = textVal;
        btnEls[j].style.color = bgVal;
        btnEls[j].style.borderColor = textVal;
    }

    var ghLink = document.getElementById("gh-link");
    if (ghLink) {
        ghLink.style.backgroundColor = textVal;
        ghLink.style.color = bgVal;
    }

    var playerEls = document.getElementsByClassName ? document.getElementsByClassName("player") : [];
    for (var i = 0; i < playerEls.length; i++) {
        playerEls[i].style.backgroundColor = textVal;
        playerEls[i].style.color = bgVal;
    }
}

// --- ENGINE LOGIC ---
function renderGame() {
    var statusDiv = document.getElementById("status");
    statusDiv.innerHTML = levels[currentLevel].title;

    var infoDiv = document.getElementById("info-text");
    infoDiv.innerHTML = levels[currentLevel].info + 
                        "<br><br><b>ALAMARI:</b> " + levels[currentLevel].hint;

    var taskP = document.getElementById("task-text");
    taskP.innerHTML = "AIKI: " + levels[currentLevel].desc;

    // RENDER ONLY PREVIOUS, CURRENT, AND NEXT FLOOR
    var towerDiv = document.getElementById("tower-view");
    var html = "";
    
    var minIdx = Math.max(0, currentLevel - 1);
    var maxIdx = Math.min(levels.length - 1, currentLevel + 1);

    for (var i = maxIdx; i >= minIdx; i--) {
        var marker = (i === currentLevel) ? " [@]" : " [ ]";
        var activeClass = (i === currentLevel) ? " player" : "";
        var labelText = (i === 0) ? "Dari 0 (Jagora)" : "Dari " + i + " (" + levels[i].id + ")";
        html += '<div class="step' + activeClass + '">' + labelText + marker + '</div>';
    }
    towerDiv.innerHTML = html;
    
    applyColors();
}

function checkCode() {
    var code = document.getElementById("user-code").value;
    var msgBox = document.getElementById("msg-box");
    
    if (levels[currentLevel].check(code)) {
        if (currentLevel < levels.length - 1) {
            msgBox.style.color = document.body.style.color;
            msgBox.innerHTML = "NASARA! Kodiya na darin na gida: " + levels[currentLevel+1].id;
            currentLevel++;
            document.getElementById("user-code").value = "";
            renderGame();
        } else {
            msgBox.style.color = document.body.style.color;
            msgBox.innerHTML = "🏆 HASUMIYA YATUKOSHI! Ka kuyi HTML! 🏆";
            renderGame();
        }
    } else {
        msgBox.style.color = "#ff3333";
        msgBox.innerHTML = "KUSKURE. Duba shigarwarka da sake ƙoƙari!";
    }
}

function jumpLevel() {
    var pass = document.getElementById("level-pass").value.toUpperCase();
    var found = -1;
    for (var i = 0; i < levels.length; i++) {
        if (levels[i].id === pass) {
            found = i;
            break;
        }
    }
    var msgBox = document.getElementById("msg-box");
    if (found !== -1) {
        currentLevel = found;
        msgBox.style.color = document.body.style.color;
        msgBox.innerHTML = "Tsalle zuwa dari " + currentLevel + ".";
        document.getElementById("level-pass").value = "";
        renderGame();
    } else {
        msgBox.style.color = "#ff3333";
        msgBox.innerHTML = "Kodiya na Dari Mara!";
    }
}

// Initial Run
renderGame();
