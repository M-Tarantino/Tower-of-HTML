<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<title>Tower of HTML</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
    background-color: #000000;
    color: #00ff00;
    font-family: monospace;
    padding: 10px;
    margin: 0;
}
.container {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
}
.header {
    border-bottom: 1px solid currentColor;
    padding-bottom: 8px;
    margin-bottom: 12px;
}
.header-table {
    width: 100%;
    border-collapse: collapse;
}
.header-left {
    text-align: right;
    vertical-align: middle;
}
.header-right {
    text-align: left;
    vertical-align: middle;
}
h1 {
    font-size: 16px;
    margin: 0;
    display: inline;
}
.top-btn {
    width: auto !important;
    padding: 2px 6px !important;
    margin-right: 6px !important;
    display: inline-block !important;
    font-size: 10px !important;
    vertical-align: middle;
}
.github-btn {
    width: auto !important;
    padding: 2px 6px !important;
    margin-right: 6px !important;
    display: inline-block !important;
    font-size: 10px !important;
    text-decoration: none;
    font-weight: bold;
}
.lang-tag {
    font-size: 11px;
    font-weight: bold;
}
.theme-panel {
    display: none;
    border: 1px solid currentColor;
    padding: 8px;
    margin-bottom: 12px;
    font-size: 11px;
}
.preset-group {
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px dashed currentColor;
}
.theme-panel label {
    margin-left: 10px;
}
.theme-panel input[type="text"] {
    width: 65px;
    background-color: transparent;
    color: inherit;
    border: 1px solid currentColor;
    font-family: monospace;
    font-size: 11px;
    padding: 2px 4px;
}
.tower {
    border: 1px solid currentColor;
    padding: 8px;
    margin-bottom: 10px;
    min-height: 85px;
}
.step {
    border-bottom: 1px dashed currentColor;
    padding: 3px;
    font-size: 12px;
}
.step:last-child {
    border-bottom: none;
}
.player {
    font-weight: bold;
    color: #000000;
    background-color: #00ff00;
}
.info-box {
    border: 1px solid currentColor;
    padding: 10px;
    font-size: 12px;
    margin-bottom: 10px;
    line-height: 1.4;
}
textarea, input[type="text"] {
    width: 100%;
    background-color: transparent;
    color: inherit;
    border: 1px solid currentColor;
    font-family: monospace;
    box-sizing: border-box;
    padding: 6px;
    margin-bottom: 6px;
}
button {
    background-color: #00ff00;
    color: #000000;
    border: 1px solid #00ff00;
    font-family: monospace;
    font-weight: bold;
    width: 100%;
    padding: 10px;
    cursor: pointer;
}
.preset-btn {
    width: auto !important;
    padding: 3px 6px !important;
    margin-left: 3px !important;
    margin-bottom: 3px !important;
    display: inline-block !important;
    font-size: 10px !important;
}
.msg {
    margin-top: 8px;
    font-size: 12px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
    <!-- HEADER BAR -->
    <div class="header">
        <table class="header-table">
            <tr>
                <td class="header-left">
                    <h1>برج HTML</h1>
                    <button class="top-btn" onclick="toggleThemeMenu()">[الألوان]</button>
                </td>
                <td class="header-right">
                    <span class="lang-tag">AR</span>
                    <a href="https://github.com/M-Tarantino" target="_blank" class="github-btn" id="gh-link">@M-Tarantino</a>
                </td>
            </tr>
        </table>
    </div>
    
    <!-- COLLAPSIBLE COLOR MENU -->
    <div class="theme-panel" id="theme-menu">
        <div class="preset-group">
            <span style="font-weight:bold; display:block; margin-bottom:4px;">الإعدادات المسبقة:</span>
            <button class="preset-btn" onclick="setPreset('#000000', '#00ff00')">ماتريكس</button>
            <button class="preset-btn" onclick="setPreset('#000000', '#ffb000')">كهرماني</button>
            <button class="preset-btn" onclick="setPreset('#0000aa', '#ffffff')">أزرق DOS</button>
            <button class="preset-btn" onclick="setPreset('#ffffff', '#111111')">فاتح</button>
            <button class="preset-btn" onclick="setPreset('#1a0022', '#00ffff')">سايبر</button>
        </div>
        <div>
            <span style="font-weight:bold;">مخصص:</span>
            <label>الخلفية: <input type="text" id="bg-color-in" value="#000000" onchange="applyColors()"></label>
            <label>النص: <input type="text" id="text-color-in" value="#00ff00" onchange="applyColors()"></label>
            <button class="preset-btn" onclick="applyColors()">تطبيق</button>
        </div>
    </div>

    <div id="status" style="font-size:14px; font-weight:bold; margin-bottom:5px;"></div>
    
    <!-- TOWER VIEW (SHOWING PREVIOUS, CURRENT, AND NEXT FLOOR) -->
    <div class="tower" id="tower-view">
        <!-- Rendered via JS -->
    </div>

    <!-- EXPLANATION BOX -->
    <div class="info-box" id="info-text">
        <!-- Text rendered via JS -->
    </div>

    <div id="task-box">
        <p id="task-text" style="font-size:12px; font-weight:bold; margin: 0 0 5px 0;"></p>
        <textarea id="user-code" rows="3" placeholder="اكتب الشفرة هنا..."></textarea>
        <button onclick="checkCode()">التحقق من الشفرة</button>
    </div>

    <div style="margin-top: 15px; border-top: 1px solid currentColor; padding-top: 8px;">
        <p style="font-size:10px; margin:0 0 3px 0;">أدخل رمز الطابق للانتقال السريع:</p>
        <input type="text" id="level-pass" placeholder="مثال: START أو L1-ROOT">
        <button onclick="jumpLevel()">الانتقال إلى الطابق</button>
    </div>

    <div class="msg" id="msg-box"></div>
</div>

<script>
// --- LEVEL DATA (FLOOR 0 INTRO + FLOORS 1 - 40+) ---
var levels = [
    {
        id: "START",
        title: "الطابق 0: نظرة عامة وتعليمات",
        info: "مرحباً بك في <b>برج HTML</b>!<br><br><b>ما هذا؟</b><br>لعبة تفاعلية صُممت لتعليمك أساسيات HTML خطوة بخطوة.<br><br><b>كيف تعمل اللعبة؟</b><br>1. اقرأ الشرح في كل طابق.<br>2. اكتب كود HTML المطلوب في حقل الإدخال.<br>3. انقر على <b>التحقق من الشفرة</b> للتقدم.<br>4. ستحصل على رمز لحفظ تقدمك أو الانتقال إلى الطوابق المكتملة.",
        hint: "اكتب كلمة <b>START</b> للدخول إلى البرج.",
        desc: "اكتب الأحرف بالضبط: START",
        check: function(input) {
            return input.toLowerCase().indexOf("start") !== -1;
        }
    },
    // --- PHASE 1: FOUNDATION (Floors 1-8) ---
    {
        id: "L1-ROOT",
        title: "الطابق 1: العنصر الجذر (Root Element)",
        info: "يتكون الكود من تعليمات يقرأها المتصفح.<br><br>تبني HTML صفحات الويب باستخدام <b>الوسوم (Tags)</b>. الوسم هو كلمة مفتاحية توضع بين رمزي أقواس زاويّة:<br>• <b>&lt;</b> (رمز أصغر من)<br>• <b>&gt;</b> (رمز أكبر من)<br><br>أول وسم في أي صفحة ويب هو <b>html</b>. عند كتابته بالأقواس يظهر كالتالي: <code>&lt;html&gt;</code>.",
        hint: "استخدم المفتَاحين '>' و '<' على لوحة المفاتيح.",
        desc: "اكتب الأحرف بالضبط: <html>",
        check: function(input) {
            return input.toLowerCase().indexOf("<html>") !== -1;
        }
    },
    {
        id: "L2-HEAD",
        title: "الطابق 2: قسم الرأس (Head Section)",
        info: "تنقسم صفحات الويب إلى قسمين رئيسيين: الإعدادات غير المرئية والمحتوى المرئي.<br><br>يُسمى القسم غير المرئي <b>head</b>. ويحتوي على الإعدادات والبيانات الوصفية للمتصفح.<br><br>تماماً مثل الطابق 1، تكتب هذا الوسم بإحاطة كلمة <b>head</b> بالأقواس: <code>&lt;head&gt;</code>.",
        hint: "اكتب '<'، ثم 'head'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: <head>",
        check: function(input) {
            return input.toLowerCase().indexOf("<head>") !== -1;
        }
    },
    {
        id: "L3-TITLE",
        title: "الطابق 3: عنوان الصفحة (Title)",
        info: "داخل قسم الرأس، تقوم بتحديد اسم صفحة الويب الخاصة بك.<br><br>يظهر هذا الاسم على التبويب في أعلى متصفح الويب. الوسم المخصص لذلك هو <b>title</b>.<br><br>أحط كلمة <b>title</b> بالأقواس: <code>&lt;title&gt;</code>.",
        hint: "اجمع بين '<'، و'title'، و'>'.",
        desc: "اكتب الأحرف بالضبط: <title>",
        check: function(input) {
            return input.toLowerCase().indexOf("<title>") !== -1;
        }
    },
    {
        id: "L4-BODY",
        title: "الطابق 4: قسم جسم الصفحة (Body Section)",
        info: "الآن ننتقل إلى الجزء المرئي من الموقع!<br><br>كل ما يعرض على الشاشة (نصوص، صور، أزرار) ينتمي إلى داخل <b>body</b>.<br><br>الوسم المخصص لهذا القسم هو <code>&lt;body&gt;</code>.",
        hint: "اكتب '<'، يليه 'body'، يليه '>'",
        desc: "اكتب الأحرف بالضبط: <body>",
        check: function(input) {
            return input.toLowerCase().indexOf("<body>") !== -1;
        }
    },
    {
        id: "L5-PARA",
        title: "الطابق 5: الفقرات (Paragraphs)",
        info: "داخل قسم الجسم، تكتب الفقرات النصية.<br><br>تستخدم HTML الحرف المرفرد <b>p</b> (اختصاراً لـ 'paragraph').<br><br>الوسم المخصص للفقرة هو <code>&lt;p&gt;</code>.",
        hint: "اكتب '<'، ثم 'p'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: <p>",
        check: function(input) {
            return input.toLowerCase().indexOf("<p>") !== -1;
        }
    },
    {
        id: "L6-CLOSE-P",
        title: "الطابق 6: وسوم الإغلاق (الفقرة)",
        info: "معظم وسوم HTML يجب أن يتم <b>إغلاقها</b> عندما تنتهي منها.<br><br>لإغلاق الوسم، استخدم نفس الكلمة المكتوبة في وسم الفتح، ولكن أضف خطاً مائلاً <b>/</b> في البداية.<br><br>لإغلاق وسم الفقرة، اكتب: <code>&lt;/p&gt;</code><br><br>مثال على فقرة كاملة:<br><code>&lt;p&gt;Hello World&lt;/p&gt;</code>",
        hint: "اكتب '<'، ثم '/'، ثم 'p'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: </p>",
        check: function(input) {
            return input.toLowerCase().indexOf("</p>") !== -1;
        }
    },
    {
        id: "L7-CLOSE-BODY",
        title: "الطابق 7: إغلاق وسم الجسم",
        info: "تماماً مثل وسم الفقرة، يجب إغلاق قسم الجسم بعد الانتهاء من إضافة المحتوى.<br><br>وسم إغلاق الجسم هو: <code>&lt;/body&gt;</code><br><br>تذكر: كل وسم فتح يحتاج إلى وسم إغلاق!",
        hint: "اكتب '<'، ثم '/'، ثم 'body'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: </body>",
        check: function(input) {
            return input.toLowerCase().indexOf("</body>") !== -1;
        }
    },
    {
        id: "L8-CLOSE-HTML",
        title: "الطابق 8: إغلاق وسم HTML",
        info: "أول وسم قمت بفتحه كان <code>&lt;html&gt;</code>. الآن يجب عليك إغلاقه.<br><br>وسم إغلاق html هو: <code>&lt;/html&gt;</code><br><br>هذا يغلق هيكل صفحة الويب بالكامل.",
        hint: "اكتب '<'، ثم '/'، ثم 'html'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: </html>",
        check: function(input) {
            return input.toLowerCase().indexOf("</html>") !== -1;
        }
    },
    // --- PHASE 2: CONTENT & TEXT (Floors 9-18) ---
    {
        id: "L9-H1",
        title: "الطابق 9: العنوان الرئيسي (H1)",
        info: "تُستخدم العناوين لتنظيم المحتوى وجعل العناوين بارزة.<br><br>أكبر عنوان هو <b>h1</b> (h = عنوان، 1 = مستوى الحجم).<br><br>تحتوي HTML على 6 مستويات للعناوين: من h1 (الأكبر) إلى h6 (الأصغر).<br><br>أنشئ عنوان h1 باستخدام: <code>&lt;h1&gt;</code>",
        hint: "اكتب '<'، ثم 'h1'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: <h1>",
        check: function(input) {
            return input.toLowerCase().indexOf("<h1>") !== -1;
        }
    },
    {
        id: "L10-H2",
        title: "الطابق 10: العنوان الفرعي (H2)",
        info: "تحت h1، حجم العنوان التالي هو <b>h2</b>.<br><br>استخدم h2 لعناوين الأقسام الواقعة تحت عنوانك الرئيسي.<br><br>مثال للهيكل:<br><code>&lt;h1&gt;My Website&lt;/h1&gt;</code><br><code>&lt;h2&gt;About Me&lt;/h2&gt;</code>",
        hint: "اكتب '<'، ثم 'h2'، then '>'.",
        desc: "اكتب الأحرف بالضبط: <h2>",
        check: function(input) {
            return input.toLowerCase().indexOf("<h2>") !== -1;
        }
    },
    {
        id: "L11-CLOSE-H1",
        title: "الطابق 11: إغلاق العنوان H1",
        info: "مثل جميع وسوم HTML، يجب إغلاق العناوين.<br><br>لإغلاق وسم h1، اكتب: <code>&lt;/h1&gt;</code><br><br>مثال كامل:<br><code>&lt;h1&gt;Welcome!&lt;/h1&gt;</code>",
        hint: "اكتب '<'، ثم '/'، ثم 'h1'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: </h1>",
        check: function(input) {
            return input.toLowerCase().indexOf("</h1>") !== -1;
        }
    },
    {
        id: "L12-BOLD",
        title: "الطابق 12: النص العريض (Bold)",
        info: "لجعل النص <b>عريضاً</b> (أكثر سمكاً ووضوحاً)، استخدم الوسم <b>b</b>.<br><br>يرمز حرف b إلى كلمة 'bold'.<br><br>مثال:<br><code>&lt;p&gt;This is &lt;b&gt;important&lt;/b&gt; text.&lt;/p&gt;</code>",
        hint: "اكتب '<'، ثم 'b'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: <b>",
        check: function(input) {
            return input.toLowerCase().indexOf("<b>") !== -1;
        }
    },
    {
        id: "L13-CLOSE-BOLD",
        title: "الطابق 13: إغلاق وسم النص العريض",
        info: "أغلق وسم النص العريض بـ: <code>&lt;/b&gt;</code><br><br>تذكر إغلاق الوسوم مباشرة بعد المحتوى الذي تريد تنسيقه!",
        hint: "اكتب '<'، ثم '/'، ثم 'b'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: </b>",
        check: function(input) {
            return input.toLowerCase().indexOf("</b>") !== -1;
        }
    },
    {
        id: "L14-ITALIC",
        title: "الطابق 14: النص المائل (Italic)",
        info: "لجعل النص <i>مائلاً</i>، استخدم الوسم <b>i</b>.<br><br>يرمز حرف i إلى كلمة 'italic'.<br><br>مثال:<br><code>&lt;p&gt;This is &lt;i&gt;fancy&lt;/i&gt; text.&lt;/p&gt;</code>",
        hint: "اكتب '<'، ثم 'i'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: <i>",
        check: function(input) {
            return input.toLowerCase().indexOf("<i>") !== -1;
        }
    },
    {
        id: "L15-CLOSE-ITALIC",
        title: "الطابق 15: إغلاق وسم النص المائل",
        info: "أغلق وسم النص المائل بـ: <code>&lt;/i&gt;</code>",
        hint: "اكتب '<'، ثم '/'، ثم 'i'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: </i>",
        check: function(input) {
            return input.toLowerCase().indexOf("</i>") !== -1;
        }
    },
    {
        id: "L16-STRONG",
        title: "الطابق 16: التأكيد القوي (Strong)",
        info: "مشابه للنص العريض، يقوم الوسم <b>strong</b> بالتشديد على النص.<br><br>وهو أقوى دلالياً من b — فهو يخبر المتصفح أن هذا النص <b>مهم</b>.<br><br>مثال:<br><code>&lt;p&gt;&lt;strong&gt;Warning:&lt;/strong&gt; Be careful!&lt;/p&gt;</code>",
        hint: "اكتب '<'، ثم 'strong'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: <strong>",
        check: function(input) {
            return input.toLowerCase().indexOf("<strong>") !== -1;
        }
    },
    {
        id: "L17-CLOSE-STRONG",
        title: "الطابق 17: إغلاق وسم التأكيد القوي",
        info: "أغلق وسم strong بـ: <code>&lt;/strong&gt;</code>",
        hint: "اكتب '<'، ثم '/'، ثم 'strong'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: </strong>",
        check: function(input) {
            return input.toLowerCase().indexOf("</strong>") !== -1;
        }
    },
    {
        id: "L18-EM",
        title: "الطابق 18: التوكيد (EM)",
        info: "يضيف الوسم <b>em</b> توكيداً على النص (مشابه للمائل).<br><br>يعني دلالياً 'مُؤكَّد'، لكي تعرف قارئات الشاشة أنه مهم.<br><br>مثال:<br><code>&lt;p&gt;I &lt;em&gt;really&lt;/em&gt; love coding!&lt;/p&gt;</code>",
        hint: "اكتب '<'، ثم 'em'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: <em>",
        check: function(input) {
            return input.toLowerCase().indexOf("<em>") !== -1;
        }
    },
    // --- PHASE 3: LINKS & MEDIA (Floors 19-28) ---
    {
        id: "L19-ANCHOR",
        title: "الطابق 19: وسم الرابط (Anchor)",
        info: "لإنشاء <b>روابط</b> قابلة للنقر تؤدي إلى مواضع أخرى، استخدم الوسم <b>a</b>.<br><br>يرمز حرف a إلى 'anchor' (مرساة).<br><br>مثال:<br><code>&lt;a&gt;Click me&lt;/a&gt;</code>",
        hint: "اكتب '<'، ثم 'a'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: <a>",
        check: function(input) {
            return input.toLowerCase().indexOf("<a>") !== -1;
        }
    },
    {
        id: "L20-HREF",
        title: "الطابق 20: وجهة الرابط (HREF)",
        info: "تحتاج الروابط إلى وجهة! استخدم الخاصية <b>href</b> لتحديد الرابط (URL).<br><br><b>الخصائص (Attributes)</b> هي سمات تُضاف إلى الوسوم.<br><br>مثال:<br><code>&lt;a href=\"https://google.com\"&gt;Google&lt;/a&gt;</code><br><br>اكتب الوسم الكامل مع الخاصية href موجهاً إلى google.com",
        hint: 'استخدم: <a href="https://google.com">',
        desc: 'اكتب: <a href="https://google.com">',
        check: function(input) {
            var lower = input.toLowerCase();
            return lower.indexOf("<a") !== -1 && lower.indexOf("href") !== -1 && lower.indexOf("google.com") !== -1;
        }
    },
    {
        id: "L21-CLOSE-ANCHOR",
        title: "الطابق 21: إغلاق وسم الرابط",
        info: "أغلق وسم الرابط بـ: <code>&lt;/a&gt;</code><br><br>مثال كامل:<br><code>&lt;a href=\"https://google.com\"&gt;Visit Google&lt;/a&gt;</code>",
        hint: "اكتب '<'، ثم '/'، ثم 'a'، ثم '>'.",
        desc: "اكتب الأحرف بالضبط: </a>",
        check: function(input) {
            return input.toLowerCase().indexOf("</a>") !== -1;
        }
    },
    {
        id: "L22-IMG",
        title: "الطابق 22: وسم الصورة",

var currentLevel = 0;

// --- MENU TOGGLE FUNCTION ---
function toggleThemeMenu() {
    var menu = document.getElementById("theme-menu");
    if (menu.style.display === "block") {
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}

// --- PRESET SELECTION FUNCTION ---
function setPreset(bgHex, textHex) {
    document.getElementById("bg-color-in").value = bgHex;
    document.getElementById("text-color-in").value = textHex;
    applyColors();
}

// --- COLOR CUSTOMIZER FUNCTION ---
function applyColors() {
    var bgVal = document.getElementById("bg-color-in").value;
    var textVal = document.getElementById("text-color-in").value;
    
    document.body.style.backgroundColor = bgVal;
    document.body.style.color = textVal;
    
    var btnEls = document.getElementsByTagName("button");
    for (var j = 0; j < btnEls.length; j++) {
        btnEls[j].style.backgroundColor = textVal;
        btnEls[j].style.color = bgVal;
        btnEls[j].style.borderColor = textVal;
    }

    var ghLink = document.getElementById("gh-link");
    if (ghLink) {
        ghLink.style.backgroundColor = textVal;
        ghLink.style.color = bgVal;
    }

    var playerEls = document.getElementsByClassName ? document.getElementsByClassName("player") : [];
    for (var i = 0; i < playerEls.length; i++) {
        playerEls[i].style.backgroundColor = textVal;
        playerEls[i].style.color = bgVal;
    }
}

// --- ENGINE LOGIC ---
function renderGame() {
    var statusDiv = document.getElementById("status");
    statusDiv.innerHTML = levels[currentLevel].title;

    var infoDiv = document.getElementById("info-text");
    infoDiv.innerHTML = levels[currentLevel].info + 
                        "<br><br><b>تلميح:</b> " + levels[currentLevel].hint;

    var taskP = document.getElementById("task-text");
    taskP.innerHTML = "المهمة: " + levels[currentLevel].desc;

    // RENDER ONLY PREVIOUS, CURRENT, AND NEXT FLOOR
    var towerDiv = document.getElementById("tower-view");
    var html = "";
    
    var minIdx = Math.max(0, currentLevel - 1);
    var maxIdx = Math.min(levels.length - 1, currentLevel + 1);

    for (var i = maxIdx; i >= minIdx; i--) {
        var marker = (i === currentLevel) ? " [@]" : " [ ]";
        var activeClass = (i === currentLevel) ? " player" : "";
        var labelText = (i === 0) ? "الطابق 0 (التعليمات)" : "الطابق " + i + " (" + levels[i].id + ")";
        html += '<div class="step' + activeClass + '">' + labelText + marker + '</div>';
    }
    towerDiv.innerHTML = html;
    
    applyColors();
}

function checkCode() {
    var code = document.getElementById("user-code").value;
    var msgBox = document.getElementById("msg-box");
    
    if (levels[currentLevel].check(code)) {
        if (currentLevel < levels.length - 1) {
            msgBox.style.color = document.body.style.color;
            msgBox.innerHTML = "نجاح! رمز الطابق التالي: " + levels[currentLevel+1].id;
            currentLevel++;
            document.getElementById("user-code").value = "";
            renderGame();
        } else {
            msgBox.style.color = document.body.style.color;
            msgBox.innerHTML = "🏆 تسلقت البرج بنجاح! لقد أتقنت HTML! 🏆";
            renderGame();
        }
    } else {
        msgBox.style.color = "#ff3333";
        msgBox.innerHTML = "غير صحيح. تحقق من مدخلاتك وحاول مرة أخرى!";
    }
}

function jumpLevel() {
    var pass = document.getElementById("level-pass").value.toUpperCase();
    var found = -1;
    for (var i = 0; i < levels.length; i++) {
        if (levels[i].id === pass) {
            found = i;
            break;
        }
    }
    var msgBox = document.getElementById("msg-box");
    if (found !== -1) {
        currentLevel = found;
        msgBox.style.color = document.body.style.color;
        msgBox.innerHTML = "تم الانتقال إلى الطابق " + currentLevel + ".";
        document.getElementById("level-pass").value = "";
        renderGame();
    } else {
        msgBox.style.color = "#ff3333";
        msgBox.innerHTML = "رمز الطابق غير صحيح!";
    }
}

// Initial Run
renderGame();
</script>
